[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "parlando"
dynamic = ["version"]
description = "Local voice dictation for macOS (Apple Silicon): tap a key, speak, and your words are typed into any app. 100% on-device."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Furkan Can" }]
keywords = [
    "dictation",
    "speech-to-text",
    "voice-typing",
    "asr",
    "macos",
    "mlx",
    "apple-silicon",
    "whisper",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: MacOS X",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3",
    "Topic :: Multimedia :: Sound/Audio :: Speech",
]
dependencies = [
    "mlx>=0.22.0",
    "mlx-lm>=0.22.0",
    "numpy",
    "sounddevice",
    "setuptools",
    "transformers",
    "huggingface_hub",
    "webrtcvad",
    "rich",
    "pyobjc-framework-Quartz",
    "pyobjc-framework-ApplicationServices",
    "pynput",
    "onnxruntime",
    "rumps",
]

[project.urls]
Homepage = "https://github.com/furkanc/parlando"
Issues = "https://github.com/furkanc/parlando/issues"
Changelog = "https://github.com/furkanc/parlando/blob/main/CHANGELOG.md"

[project.scripts]
parlando = "parlando.engine:main"
parlando-menubar = "parlando.menubar:main"

[tool.hatch.version]
path = "src/parlando/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/parlando"]
